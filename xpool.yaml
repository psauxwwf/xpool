log:
  level: info
  path: ""
source:
  file: proxy.txt
xray:
  binary_path: xray
  generated_path: config.json
  api_address: 127.0.0.1:10085
  generated_log_level: warning
  ping_timeout: 5s
  sampling: 3
status:
  address: 127.0.0.1:18080
runtime:
  rotation_interval: 1m0s
  startup_timeout: 30s
  failover_cooldown: 5s
health:
  check_urls:
    - https://web.telegram.org/js/app.js
  check_interval: 1m0s
  ready_ttl: 10m0s
  timeout: 3s
  concurrency: 32
  jitter: 5s
  max_bytes: 10485760
  ready_successes: 1
